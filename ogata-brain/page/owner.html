<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: the public talk timeline, with Ogata's reply boxes. Night-only look by choice (matches the official site). */
:root{
  --bg:#020409; --panel:#08122a; --ink:#e6f2ff; --muted:#7f97b6;
  --line:rgba(0,224,255,.16); --cyan:#00e0ff;
  --chisato:#e58cff; --makoto:#58a6ff; --ogata:#8dff5a;
  --font-disp:"Chakra Petch",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --font-jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,#0a1a36 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--font-jp);font-size:15px;line-height:1.75}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
.eyebrow{margin:0;font-family:var(--font-mono);font-size:11px;letter-spacing:.24em;color:var(--cyan);text-transform:uppercase}
h1{margin:2px 0 0;font-family:var(--font-disp);font-size:clamp(26px,7vw,36px);line-height:1.2;letter-spacing:.04em;text-wrap:balance}
h1 .c{color:var(--chisato)} h1 .m{color:var(--makoto)}
.lead{margin:4px 0 0;color:var(--muted);font-size:13px}
.compose{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid rgba(141,255,90,.35);border-radius:10px;background:rgba(141,255,90,.05)}
.compose label{font-size:13px;font-weight:700;color:var(--ogata)}
textarea{width:100%;background:rgba(2,4,9,.75);color:var(--ink);border:1px solid rgba(141,255,90,.35);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.6;resize:vertical;min-height:64px}
textarea:focus-visible{outline:2px solid var(--ogata);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.msg{margin-right:auto;font-size:12px;color:var(--muted)}
.send,.ghost{font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:7px 18px;cursor:pointer}
.send{background:var(--ogata);color:#06120a;border:0}
.send:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.send:focus-visible,.ghost:focus-visible,.reply-btn:focus-visible{outline:2px solid var(--ogata);outline-offset:2px}
.day{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.day-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.day-head .d{font-family:var(--font-mono);font-size:12px;color:var(--cyan);font-variant-numeric:tabular-nums}
.day-head .t{font-size:13px;color:var(--muted);min-width:0}
.post{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post img{width:40px;height:40px;border-radius:50%}
.chisato img{box-shadow:0 0 0 1px var(--chisato)} .makoto img{box-shadow:0 0 0 1px var(--makoto)} .ogata img{box-shadow:0 0 0 1px var(--ogata)}
.post.ogata{background:linear-gradient(90deg,rgba(141,255,90,.07),transparent 60%)}
.body{min-width:0;display:flex;flex-direction:column;gap:2px}
.meta{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.meta .n{font-weight:700}
.chisato .n{color:var(--chisato)} .makoto .n{color:var(--makoto)} .ogata .n{color:var(--ogata)}
.meta .h,.meta .tm{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.re{font-size:12px;color:var(--muted)}
.re q{quotes:none;display:block;border-left:2px solid var(--line);padding-left:8px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.reply-btn{align-self:flex-start;margin-top:4px;font:inherit;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ogata);border:1px solid rgba(141,255,90,.35);border-radius:999px;padding:3px 12px;background:transparent;cursor:pointer}
.inline{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.waiting{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.empty{padding:24px 16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:4px}
.empty strong{color:var(--ink);font-weight:700}
.foot{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.1em}
.attach{font:inherit;font-size:13px;font-weight:700;color:var(--ogata);background:transparent;border:1px dashed rgba(141,255,90,.45);border-radius:999px;padding:6px 14px;cursor:pointer}
.attach:focus-visible{outline:2px solid var(--ogata);outline-offset:2px}
.attach:disabled{opacity:.4;cursor:default}
.previews{display:flex;gap:8px;flex-wrap:wrap}
.previews:empty{display:none}
.pv{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid rgba(141,255,90,.35);background:#000}
.pv img{width:100%;height:100%;object-fit:cover;border-radius:0;box-shadow:none}
.pv button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(2,4,9,.8);color:var(--ink);font-size:13px;line-height:22px;padding:0;cursor:pointer}
.pics{display:grid;gap:4px;margin-top:6px;border-radius:10px;overflow:hidden;max-width:420px}
.pics.n1{grid-template-columns:1fr}
.pics.n2,.pics.n4{grid-template-columns:1fr 1fr}
.pics.n3{grid-template-columns:1fr 1fr 1fr}
.pic{display:block;padding:0;border:0;background:#000;cursor:zoom-in;aspect-ratio:4/3;overflow:hidden}
.pics.n1 .pic{aspect-ratio:auto;max-height:420px}
.pic img{display:block;width:100%;height:100%;object-fit:cover;border-radius:0;box-shadow:none!important}
.pics.n1 .pic img{height:auto;max-height:420px;object-fit:contain}
.pic:focus-visible{outline:2px solid var(--ogata);outline-offset:2px}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(2,4,9,.92);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Behind the stream · オガタ専用</p>
    <h1><span class="c">チサト</span>と<span class="m">マコト</span>の回線</h1>
    <p class="lead" id="status">回線に接続しています…</p>
  </header>

  <section class="compose" id="compose" aria-label="つぶやく">
    <label for="mainText">オガタとしてつぶやく</label>
    <textarea id="mainText" maxlength="280" placeholder="いま思っていること"></textarea>
    <div class="previews" id="mainPreviews"></div>
    <div class="row"><span class="msg" id="mainMsg"></span><span id="mainAttach"></span><button class="send" id="mainSend" type="button" disabled>送信</button></div>
  </section>
  <div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>

  <main id="feed">
    <div class="empty"><strong>タイムラインを読み込んでいます</strong><span>二人の投稿と、オガタさんの返信がここに並びます。</span></div>
  </main>

  <p class="foot">ここで書いた言葉と画像は、そのまま公開タイムラインにも載ります</p>
</div>

  var ACC={chisato:{n:"チサト",h:"@ChiSat_support"},makoto:{n:"マコト",h:"@makoto_sec"},ogata:{n:"オガタ",h:"@SaiOgata"}};
  var db=null,sample=null,assets=null,imgCaps=null,days=[],talks=[],brain={};
  var MAXIMG=4;
  function picUrl(x){var id=typeof x==="string"?x:(x&&x.asset);return id?"/_blob/"+id:"";}
  /* shrink a picked image to a JPEG (long side 1600px) so it uploads fast and Claude can read it */
  function shrink(file){
    var load=window.createImageBitmap?createImageBitmap(file):new Promise(function(ok,ng){var i=new Image();i.onload=function(){ok(i);};i.onerror=ng;i.src=URL.createObjectURL(file);});
    return load.then(function(img){
      var w=img.width,h=img.height,s=Math.min(1,1600/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
      var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      return new Promise(function(ok,ng){c.toBlob(function(b){b?ok(b):ng(new Error("encode"));},"image/jpeg",0.86);});
    });
  }
  /* the image picker shared by the main box and every reply box */
  function picker(slot,previews,onChange){
    var items=[];
    var input=el("input");input.type="file";input.accept="image/*";input.multiple=true;input.hidden=true;
    var btn=el("button","attach","＋ 画像");btn.type="button";btn.setAttribute("aria-label","画像を添える");
    btn.hidden=!assets;
    btn.addEventListener("click",function(){input.click();});
    input.addEventListener("change",function(){
      var fs=Array.prototype.slice.call(input.files||[]).filter(function(f){return /^image\//.test(f.type);}).slice(0,MAXIMG-items.length);
      input.value="";
      fs.forEach(function(f){
        var it={blob:null,url:""};items.push(it);draw();
        shrink(f).then(function(b){it.blob=b;it.url=URL.createObjectURL(b);draw();}).catch(function(){items.splice(items.indexOf(it),1);draw();});
      });
    });
    function draw(){
      previews.replaceChildren();
      items.forEach(function(it){
        var pv=el("div","pv");
        if(it.url){var im=el("img");im.src=it.url;im.alt="添える画像";pv.appendChild(im);}
        else pv.appendChild(el("span","waiting","…"));
        var x=el("button",null,"×");x.type="button";x.setAttribute("aria-label","この画像をはずす");
        x.addEventListener("click",function(){items.splice(items.indexOf(it),1);draw();});
        pv.appendChild(x);previews.appendChild(pv);
      });
      btn.disabled=items.length>=MAXIMG;
      if(onChange)onChange();
    }
    slot.appendChild(input);slot.appendChild(btn);
    return {
      blobs:function(){return items.filter(function(i){return i.blob;}).map(function(i){return i.blob;});},
      busy:function(){return items.some(function(i){return !i.blob;});},
      count:function(){return items.length;},
      clear:function(){items=[];draw();},
      show:function(){btn.hidden=!assets;}
    };
  }
  var pickers=[];
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function jst(ms){var d=new Date((ms==null?Date.now():ms)+9*36e5).toISOString();return {date:d.slice(0,10),time:d.slice(11,16)};}
  function fmt(d){return String(d).replace(/-/g,".");}
  var openReply=null; // keep an open reply box across re-renders

  /* ---------- character replies: asked of Claude on Ogata's own account ---------- */
  function promptFor(t){
    var b=brain.bible||{},cm=brain.chisato||{},mm=brain.makoto||{};
    var day=(days.find(function(d){return d.date===t.date;})||{}).posts||[];
    var recent=day.slice(-12).map(function(p){return p.time+" "+(ACC[p.who]?ACC[p.who].n:p.who)+":"+p.text;}).join("\n");
    var lines=[
      "あなたは、創作キャラクター二人(チサトとマコト)のSNS投稿の書き手です。オガタさん本人が二人に話しかけてきたので、二人の返事を書いてください。",
      "# 世界観\n"+(b.world||""),
      "# チサト\n"+(b.chisato||""),
      "# マコト\n"+(b.makoto||""),
      "# ルール\n"+(b.rules||[]).map(function(r){return "- "+r;}).join("\n"),
      "# チサトの記憶\n"+JSON.stringify({relationships:cm.relationships,facts:cm.facts,feelings:cm.feelings,threads:cm.threads}),
      "# マコトの記憶\n"+JSON.stringify({relationships:mm.relationships,facts:mm.facts,feelings:mm.feelings,threads:mm.threads}),
      "# 今日のタイムライン(最近)\n"+(recent||"(まだ投稿なし)")
    ];
    if(t.target)lines.push("# オガタさんが返信した投稿\n"+ACC[t.target.who].n+":「"+t.target.text+"」"+(t._targetPics?"\n(この投稿についていた画像が "+t._targetPics+" 枚、添付の最後にある)":""));
    lines.push("# オガタさんの言葉(いま "+t.time+")\n「"+(t.text||"(言葉なし、画像だけ)")+"」");
    if(t._pics)lines.push("# オガタさんが添えた画像\n"+t._pics+" 枚"+(t._targetPics?"(添付の最初の "+t._pics+" 枚)":"(添付のとおり)")+"。画像に実際に写っているもの(絵・写真・色・形・文字)をよく見て、具体的に反応する。写っていないものを作らない。よく分からない部分は分からないまま素直に言う。オガタさんが描いた絵なら、作品として感想を言う。");
    lines.push("# 書くもの\n"+(t.target?ACC[t.target.who].n+"が必ず最初に返事をする。":"内容に近いほうが返事をする。")+
      "もう一人は、自然なら短く加わってよい(加わらなくてもよい)。返事は1〜2件、それぞれ140字以内。二人の口調・一人称・呼び方を厳守。マコトに嫌味や皮肉は言わせない。オガタさんの現実の予定を勝手に作らない。"+
      "\n返事が届くまでの分数 delay を、最初の返事は5〜30、二件目はその後さらに1〜15で決める(内容や時間帯に合わせて)。"+
      '\nJSON だけを返す: {"replies":[{"who":"chisato"|"makoto","delay":分,"text":"..."}]}');
    return lines.join("\n\n");
  }
  function uploadAll(blobs){
    var ids=[];
    return blobs.reduce(function(p,b){return p.then(function(){return assets.upload(b,{type:"image/jpeg"}).then(function(r){ids.push(r.id);});});},Promise.resolve()).then(function(){return ids;});
  }
  function targetBlobs(target,room){
    var ids=(target&&target.images||[]).slice(0,Math.max(0,room));
    return Promise.all(ids.map(function(x){return fetch(picUrl(x)).then(function(r){return r.ok?r.blob():null;}).catch(function(){return null;});}))
      .then(function(bs){return bs.filter(function(b){return b&&/^image\//.test(b.type);});});
  }
  function sendTalk(text,target,blobs,msgEl,btn,done){
    if(!db)return;
    blobs=blobs||[];
    var now=Date.now(),at=jst(now);
    var id="t"+now;
    var doc={id:id,date:at.date,time:at.time,at:now,text:text,target:target||null,replies:[],status:"thinking",synced:false};
    btn.disabled=true;msgEl.textContent=blobs.length?"画像を送っています…":"送信中…";
    var up=blobs.length&&assets?uploadAll(blobs):Promise.resolve([]);
    up.then(function(ids){if(ids.length)doc.images=ids;return db.doc("talk/"+id).set(doc);}).then(function(){
      msgEl.textContent="届きました。";if(done)done();
      return askReplies(doc,blobs);
    }).catch(function(e){
      var c=e&&e.code;
      msgEl.textContent=c==="too_large"?"画像が大きすぎました。別の画像でためしてください。":c==="quota_or_state"?"画像の置き場所がいっぱいです。":"送れませんでした。もう一度押してください。";
      btn.disabled=false;
    });
  }
  /* ask Claude for the two replies to one talk; never rejects (failure is written to the doc) */
  function askReplies(doc,blobs){
    var id=doc.id,target=doc.target,now=Date.now(),at=jst(now);
    if(!sample){return db.doc("talk/"+id).update({status:"no-sample"}).catch(function(){});}
    if(doc.images&&doc.images.length&&!(imgCaps&&imgCaps.maxCount>0)){return db.doc("talk/"+id).update({status:"later"}).catch(function(){});} // images: answered next morning after a real look
    {
      var canSee=imgCaps&&imgCaps.maxCount>0;
      var maxN=canSee?imgCaps.maxCount:0;
      var mine=canSee?blobs.slice(0,maxN):[];
      return (canSee?targetBlobs(target,maxN-mine.length):Promise.resolve([])).then(function(tb){
        var ask=Object.assign({},doc,{_pics:mine.length,_targetPics:tb.length});
        var opts={modelTier:"default",cache:false};
        var all=mine.concat(tb);if(all.length)opts.images=all;
        return sample.json(promptFor(ask),opts);
      }).then(function(res){
        var list=(res&&Array.isArray(res.replies)?res.replies:[]).filter(function(r){return r&&ACC[r.who]&&r.who!=="ogata"&&typeof r.text==="string"&&r.text.trim();}).slice(0,2);
        if(!list.length)throw {code:"empty"};
        var t=Math.max(now,doc.at||now),dayEnd=new Date(doc.date+"T23:59:00+09:00").getTime(),out=[];
        list.forEach(function(r,k){
          var d=Math.max(k?1:5,Math.min(k?15:30,Math.round(Number(r.delay)||(k?5:12))));
          t=Math.min(t+d*60000,dayEnd); var tt=jst(t).time;
          if(out.length&&tt<=out[out.length-1].time)return;
          if(tt<=doc.time)return;
          out.push({who:r.who,at:t,time:tt,text:r.text.trim().slice(0,140)});
        });
        if(!out.length)throw {code:"late"};
        return db.doc("talk/"+id).update({replies:out,status:"replied",error:{__delete__:true}});
      }).catch(function(e){
        var c=String(e&&e.code||"error");
        if(c==="not_granted")showPermHint();
        return db.doc("talk/"+id).update({status:"failed",error:c}).catch(function(){});
      });
    }
  }
  function retryTalk(t,btn){
    btn.disabled=true;btn.textContent="たのんでいます…";

      var ids=(t.images||[]).slice(0,MAXIMG);
      return Promise.all(ids.map(function(x){return fetch(picUrl(x)).then(function(r){return r.ok?r.blob():null;}).catch(function(){return null;});}));
    }).then(function(bs){return askReplies(t,bs.filter(Boolean));}).catch(function(){btn.disabled=false;btn.textContent="もう一度たのむ";});

  function composer(box,ta,btn,msg,targetFn,done,slot,previews){
    var pk=null;
    var sync=function(){btn.disabled=(!ta.value.trim()&&!(pk&&pk.count()))||(pk&&pk.busy());};
    if(slot){pk=picker(slot,previews,function(){msg.textContent="";sync();});pickers.push(pk);}
    ta.addEventListener("input",function(){msg.textContent="";sync();});
    btn.addEventListener("click",function(){
      var v=ta.value.trim(),bs=pk?pk.blobs():[];
      if(!v&&!bs.length)return;
      sendTalk(v,targetFn(),bs,msg,btn,function(){ta.value="";if(pk)pk.clear();if(done)done();});
    });
  }
  function picsNode(list){
    var xs=(list||[]).filter(function(x){return picUrl(x);}).slice(0,MAXIMG);
    if(!xs.length)return null;
    var g=el("div","pics n"+xs.length);
    xs.forEach(function(x,k){
      var b=el("button","pic");b.type="button";b.setAttribute("aria-label","画像を大きく見る("+(k+1)+"/"+xs.length+")");
      var im=el("img");im.src=picUrl(x);im.alt="添えられた画像";im.loading="lazy";
      im.addEventListener("error",function(){b.replaceChildren(el("span","waiting","画像を読み込めませんでした"));});
      b.appendChild(im);
      b.addEventListener("click",function(){var lb=document.getElementById("lightbox");document.getElementById("lightboxImg").src=im.src;lb.hidden=false;});
      g.appendChild(b);
    });
    return g;
  }

  /* ---------- rendering ---------- */
  function postNode(p,byId,dayDate){
    var a=ACC[p.who],row=el("article","post "+p.who);
    var img=el("img");img.src=AV[p.who];img.alt=a.n;img.width=40;img.height=40;row.appendChild(img);
    var b=el("div","body"),m=el("div","meta");
    m.appendChild(el("span","n",a.n));m.appendChild(el("span","h",a.h));m.appendChild(el("span","tm","· "+p.time));b.appendChild(m);
    var par=(p.reply_to&&byId[p.reply_to])||p.quote;
    if(par&&ACC[par.who]){var r=el("div","re","返信先: "+ACC[par.who].h);r.appendChild(el("q",null,par.text||"(画像)"));b.appendChild(r);}
    if(p.text)b.appendChild(el("p","txt",p.text));
    var pics=picsNode(p.images);if(pics)b.appendChild(pics);
    if(p.waiting)b.appendChild(el("span","waiting",p.waiting));
    if(p.retry){var rb=el("button","reply-btn","もう一度たのむ");rb.type="button";rb.style.marginLeft="8px";rb.addEventListener("click",function(){retryTalk(p.retry,rb);});b.appendChild(rb);}
    if(p.who!=="ogata"&&dayDate){
      var key=dayDate+"/"+p.id;
      var btn=el("button","reply-btn","↩ "+a.n+"に返信");btn.type="button";
      var open=function(){
        openReply=key;btn.hidden=true;
        var wrap=el("div","inline"),ta=el("textarea");ta.maxLength=280;ta.placeholder=a.n+"に返信";ta.setAttribute("aria-label",a.n+"への返信");
        var rowEl=el("div","row"),msg=el("span","msg",""),slot=el("span"),pv=el("div","previews"),cancel=el("button","ghost","やめる"),send=el("button","send","送信");
        cancel.type="button";send.type="button";send.disabled=true;
        var close=function(){openReply=null;wrap.remove();btn.hidden=false;};
        cancel.addEventListener("click",close);
        rowEl.appendChild(msg);rowEl.appendChild(slot);rowEl.appendChild(cancel);rowEl.appendChild(send);wrap.appendChild(ta);wrap.appendChild(pv);wrap.appendChild(rowEl);b.appendChild(wrap);
        composer(wrap,ta,send,msg,function(){var t={date:dayDate,id:p.id,who:p.who,text:p.text};if(p.images&&p.images.length)t.images=p.images.map(function(x){return typeof x==="string"?x:x.asset;}).filter(Boolean);return t;},close,slot,pv);
        ta.focus();
      };
      btn.addEventListener("click",open);
      b.appendChild(btn);
      if(openReply===key)setTimeout(open,0);
    }
    row.appendChild(b);return row;
  }
  function render(){
    if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".inline"))return; // don't wipe a reply being typed
    var now=Date.now(),today=jst(now).date,feed=document.getElementById("feed");
    var byDate={};
    days.forEach(function(d){byDate[d.date]={date:d.date,title:d.title||"",posts:(d.posts||[]).slice()};});
    var synced={};
    talks.forEach(function(t){
      var d=byDate[t.date]||(byDate[t.date]={date:t.date,title:"",posts:[]});
      if(d.posts.some(function(p){return p.who==="ogata"&&p.text===t.text&&p.time===t.time;}))return; // already in the mirrored day
      var oid="t-"+t.id,o={id:oid,who:"ogata",time:t.time,text:t.text,images:t.images||null};
      if(t.target){if(t.target.date===t.date)o.reply_to=t.target.id;o.quote={who:t.target.who,text:t.target.text};}
      var shown=(t.replies||[]).filter(function(r){return r.at<=now;});
      if(t.status==="thinking"||(t.status==="replied"&&shown.length<(t.replies||[]).length))o.waiting="既読 · 二人が返事を考えています";
      if(t.status==="later")o.waiting="既読 · 画像は明日の朝、二人がちゃんと見て返事します";
      if(t.status==="failed"||t.status==="no-sample"){o.waiting="返事がまだ届いていません";if(t.date===today&&sample)o.retry=t;else o.waiting="二人に届きました。返事は明日の朝になります";}
      d.posts.push(o);
      shown.forEach(function(r,k){d.posts.push({id:oid+"r"+k,who:r.who,time:r.time,text:r.text,reply_to:k?oid+"r"+(k-1):oid,_due:true});});
    });
    var list=Object.keys(byDate).sort().reverse().filter(function(d){return d<=today;}).slice(0,7);
    if(!list.length){var e=el("div","empty");e.appendChild(el("strong",null,"まだ投稿はありません"));feed.replaceChildren(e);return;}
    var frag=document.createDocumentFragment(),nowT=jst(now);
    list.forEach(function(date){
      var d=byDate[date],box=el("section","day"),h=el("div","day-head");
      h.appendChild(el("span","d",fmt(date)));if(d.title)h.appendChild(el("span","t",d.title));box.appendChild(h);
      var byId={};d.posts.forEach(function(p){byId[p.id]=p;});
      d.posts.filter(function(p){return ACC[p.who]&&(p._due||date<nowT.date||p.time<=nowT.time||p.who==="ogata");})
        .sort(function(a,b){return String(b.time).localeCompare(String(a.time));})
        .forEach(function(p){box.appendChild(postNode(p,byId,date));});
      frag.appendChild(box);
    });
    feed.replaceChildren(frag);
  }

  setInterval(render,30000);
  document.getElementById("lightbox").addEventListener("click",function(){this.hidden=true;document.getElementById("lightboxImg").removeAttribute("src");});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"){var lb=document.getElementById("lightbox");if(!lb.hidden){lb.hidden=true;}}});

  (async function(){
    var st=document.getElementById("status");
    try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
    try{sample=window.claude&&window.claude.use?await window.claude.use("sample"):null;}catch(e){sample=null;}
    try{assets=window.claude&&window.claude.use?await window.claude.use("assets"):null;}catch(e){assets=null;}
    if(sample&&sample.limits){try{var lim=await sample.limits();imgCaps=lim&&lim.images||null;}catch(e){imgCaps=null;}}
    try{perms=window.claude&&window.claude.use?await window.claude.use("permissions"):null;}catch(e){perms=null;}
    if(imgCaps&&imgCaps.maxCount)MAXIMG=Math.max(1,Math.min(4,imgCaps.maxCount));
    composer(document.getElementById("compose"),document.getElementById("mainText"),document.getElementById("mainSend"),document.getElementById("mainMsg"),function(){return null;},null,document.getElementById("mainAttach"),document.getElementById("mainPreviews"));
    if(!db){st.textContent="この画面では回線を開けません。Claudeアプリで開いてください。";document.getElementById("compose").hidden=true;return;}
    st.textContent="接続済み · 書いて送ると、二人が少しあとで返事をくれます";
    if(perms&&perms.state&&sample){perms.state("sample").then(function(v){if(v==="denied")showPermHint();}).catch(function(){});}
    db.collection("days").orderBy("date","desc").limit(7).onSnapshot(function(s){days=s.docs.map(function(d){return d.data();});render();},function(){});
    db.collection("talk").orderBy("at","desc").limit(60).onSnapshot(function(s){talks=s.docs.map(function(d){return d.data();});render();},function(){});
    ["bible","chisato","makoto"].forEach(function(k){db.doc("brain/"+k).onSnapshot(function(s){brain[k]=s.exists?s.data():null;},function(){});});
  })();
})();
</script>
